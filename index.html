<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Was fehlt?</title>
<style>
  :root {
    --bg-1: #17281f;
    --bg-2: #1f3729;
    --panel: #24402f;
    --panel-edge: #3a5b45;
    --wood: #5a3d2a;
    --wood-dark: #472f20;
    --chalk: #f4f1e4;
    --chalk-dim: #cfd6c9;
    --chalk-yellow: #f0c869;
    --chalk-yellow-dark: #c99f45;
    --chalk-pink: #e8879a;
    --chalk-blue: #7fb8cf;
    --chalk-blue-dark: #4f8ea6;
    --shadow: rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 70%);
    color: var(--chalk);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    height: -webkit-fill-available;
    padding: 2.2vh 2.5vw 2.5vh;
    gap: 1.6vh;
  }

  /* subtle chalk dust texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0.5px, transparent 0.5px),
      radial-gradient(circle at 70% 60%, #fff 0.5px, transparent 0.5px),
      radial-gradient(circle at 40% 80%, #fff 0.5px, transparent 0.5px);
    background-size: 3px 3px, 4px 4px, 5px 5px;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4vh;
    flex-shrink: 0;
  }

  h1 {
    margin: 0;
    font-family: "Chalkboard SE", "Comic Sans MS", var(--font-fallback), cursive;
    font-weight: 700;
    font-size: clamp(28px, 5.5vh, 56px);
    letter-spacing: 0.5px;
    color: var(--chalk);
    text-shadow: 0 0 14px rgba(244,241,228,0.15);
  }

  .round-row {
    display: flex;
    align-items: center;
    gap: 0.8vh;
  }

  .round-badge {
    font-size: clamp(12px, 1.8vh, 16px);
    color: var(--chalk-yellow);
    background: rgba(240,200,105,0.12);
    border: 1px solid rgba(240,200,105,0.4);
    padding: 0.4vh 1.6vh;
    border-radius: 999px;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .reset-btn {
    width: 3.2vh;
    height: 3.2vh;
    min-width: 28px;
    min-height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(240,200,105,0.4);
    background: rgba(240,200,105,0.12);
    color: var(--chalk-yellow);
    font-size: clamp(14px, 2vh, 18px);
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .reset-btn:active {
    transform: rotate(-90deg);
    background: rgba(240,200,105,0.25);
  }

  .setup-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1.2vh;
    flex-shrink: 0;
  }

  select, input[type="number"] {
    font-family: inherit;
    font-size: clamp(14px, 2vh, 18px);
    font-weight: 600;
    padding: 1.3vh 1.8vh;
    border-radius: 1.2vh;
    border: 2px solid var(--panel-edge);
    background: var(--panel);
    color: var(--chalk);
    min-height: 44px;
  }

  select:disabled, input:disabled {
    opacity: 0.4;
  }

  input[type="number"] { width: 8vh; text-align: center; }

  select:focus-visible, input:focus-visible, button:focus-visible {
    outline: 3px solid var(--chalk-blue);
    outline-offset: 2px;
  }

  .btn {
    font-family: inherit;
    font-size: clamp(14px, 2.1vh, 18px);
    font-weight: 700;
    padding: 1.3vh 2.6vh;
    border-radius: 1.2vh;
    border: none;
    cursor: pointer;
    min-height: 44px;
    color: var(--bg-1);
    background: var(--chalk-dim);
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    text-align: center;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.15s ease;
  }

  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  .btn:disabled:active { transform: none; }

  .btn-start {
    background: var(--chalk-yellow);
    color: #3a2c10;
    box-shadow: 0 3px 0 var(--chalk-yellow-dark);
  }
  .btn-start:active { box-shadow: 0 1px 0 var(--chalk-yellow-dark); }

  .btn-remove { background: var(--chalk-pink); color: #3a1420; box-shadow: 0 3px 0 #b95d70; }
  .btn-remove:active { box-shadow: 0 1px 0 #b95d70; }

  .btn-shuffle { background: var(--chalk-blue); color: #0e2933; box-shadow: 0 3px 0 var(--chalk-blue-dark); }
  .btn-shuffle:active { box-shadow: 0 1px 0 var(--chalk-blue-dark); }

  .btn-combo {
    background: linear-gradient(135deg, var(--chalk-pink) 0%, var(--chalk-blue) 100%);
    color: #241428;
    box-shadow: 0 3px 0 #7a6b7f;
  }
  .btn-combo:active { box-shadow: 0 1px 0 #7a6b7f; }

  .btn-reveal { background: var(--chalk); color: #24402f; box-shadow: 0 3px 0 #b9b6a3; }
  .btn-reveal:active { box-shadow: 0 1px 0 #b9b6a3; }

  /* --- the chalkboard stage --- */
  .board-frame {
    flex-grow: 1;
    width: 100%;
    min-height: 0;
    padding: 1vh;
    border-radius: 2.4vh;
    background: linear-gradient(155deg, var(--wood) 0%, var(--wood-dark) 100%);
    box-shadow: 0 8px 24px var(--shadow), inset 0 0 0 2px rgba(0,0,0,0.2);
    display: flex;
  }

  #emoji-container {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    align-items: center;
    gap: clamp(10px, calc(var(--scale, 1) * 2.4vh), 40px);
    background: var(--panel);
    border: 2px dashed var(--panel-edge);
    border-radius: 1.8vh;
    padding: 2vh;
    overflow: hidden;
    transition: gap 0.35s ease;
  }

  #emoji-container.empty::before {
    content: "Wähle Kategorie & Anzahl, dann Start drücken";
    font-size: clamp(14px, 2.2vh, 20px);
    color: var(--chalk-dim);
    font-weight: 600;
    text-align: center;
    max-width: 60%;
  }

  .emoji-slot {
    font-size: clamp(34px, calc(var(--scale, 1) * 9vh), 105px);
    line-height: 1;
    padding: 0.6vh;
    border-radius: 50%;
    border: 0.6vh solid transparent;
    animation: popIn 0.35s cubic-bezier(.2,1.4,.4,1) both;
    transition: font-size 0.35s ease;
  }

  .emoji-slot.highlighted {
    border-color: var(--chalk-pink);
    animation: circleIn 0.5s ease-out both;
    box-shadow: 0 0 18px rgba(232,135,154,0.5);
  }

  @keyframes popIn {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes circleIn {
    0% { transform: scale(0.7); opacity: 0.3; border-color: transparent; }
    60% { transform: scale(1.15); border-color: var(--chalk-pink); }
    100% { transform: scale(1); opacity: 1; }
  }

  .status-line {
    flex-shrink: 0;
    font-size: clamp(13px, 2vh, 18px);
    font-weight: 600;
    color: var(--chalk-dim);
    min-height: 2.4vh;
    text-align: center;
  }

  .action-bar {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: clamp(4px, 1.6vw, 14px);
    flex-shrink: 0;
    width: 100%;
    overflow: hidden;
    container-type: inline-size;
    container-name: actions;
  }

  .action-bar .btn {
    flex: 1 1 0;
    min-width: 0;
    max-width: 220px;
    padding: 1.3vh clamp(4px, 2vw, 26px);
    white-space: nowrap;
    overflow: hidden;
  }

  .btn .label-short { display: none; }

  /* Wird's eng, bleibt nur der erste Buchstabe übrig – lieber lesbar
     schrumpfen als aus dem Bildschirm rutschen oder umbrechen. */
  @container actions (max-width: 640px) {
    .btn .label-full { display: none; }
    .btn .label-short { display: inline; }
    .action-bar .btn { padding-left: 0; padding-right: 0; }
  }
</style>
</head>
<body>

  <header>
    <h1>🧐 Was fehlt?</h1>
    <div class="round-row">
      <div class="round-badge" id="round-badge">Noch keine Runde gespielt</div>
      <button class="reset-btn" id="reset-btn" onclick="resetRounds()" title="Rundenzähler zurücksetzen" aria-label="Rundenzähler zurücksetzen">↺</button>
    </div>
  </header>

  <div class="setup-bar">
    <select id="category">
      <option value="fruits">🍎 Früchte</option>
      <option value="animals">🐶 Tiere</option>
      <option value="vehicles">🚗 Fahrzeuge</option>
      <option value="food">🍕 Essen</option>
      <option value="school">📚 Schulsachen</option>
      <option value="mix">🎲 Gemischt</option>
    </select>
    <input type="number" id="count" value="5" min="3" max="10">
    <button class="btn btn-start" id="start-btn" onclick="startGame()">Start</button>
  </div>

  <div class="board-frame">
    <div id="emoji-container" class="empty"></div>
  </div>

  <div class="status-line" id="status-line">Wähle Kategorie &amp; Anzahl, dann Start drücken</div>

  <div class="action-bar">
    <button class="btn btn-remove" id="remove-btn" onclick="removeEmoji()" disabled><span class="label-full">Entfernen</span><span class="label-short">E</span></button>
    <button class="btn btn-shuffle" id="shuffle-btn" onclick="shuffleEmojis()" disabled><span class="label-full">Mischen</span><span class="label-short">M</span></button>
    <button class="btn btn-combo" id="combo-btn" onclick="removeAndShuffle()" disabled><span class="label-full">Entfernen &amp; Mischen</span><span class="label-short">E+M</span></button>
    <button class="btn btn-reveal" id="reveal-btn" onclick="reveal()" disabled><span class="label-full">Auflösen</span><span class="label-short">A</span></button>
  </div>

<script>
  const emojiCategories = {
    fruits:   ['🍎','🍌','🍇','🍓','🍒','🍍','🥝','🍋','🍉','🍑'],
    animals:  ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🦁','🐯'],
    vehicles: ['🚗','🚕','🚙','🚌','🚎','🏎️','🚓','🚑','🚒','🚚'],
    food:     ['🍕','🍔','🍟','🌭','🥐','🧀','🥞','🍩','🍪','🥨'],
    school:   ['📚','✏️','🎒','🖍️','📐','📏','✂️','📖','🖊️','📌']
  };

  // phase: 'idle' | 'playing' | 'revealed'
  let phase = 'idle';
  let originalOrder = [];   // feste Reihenfolge der aktuellen Runde
  let currentEmojis = [];   // aktuell angezeigte (evtl. gemischte / reduzierte) Liste
  let removedEmoji = null;
  let roundNumber = 0;

  const els = {
    container: document.getElementById('emoji-container'),
    status: document.getElementById('status-line'),
    roundBadge: document.getElementById('round-badge'),
    startBtn: document.getElementById('start-btn'),
    removeBtn: document.getElementById('remove-btn'),
    shuffleBtn: document.getElementById('shuffle-btn'),
    comboBtn: document.getElementById('combo-btn'),
    revealBtn: document.getElementById('reveal-btn'),
    category: document.getElementById('category'),
    count: document.getElementById('count'),
  };

  function shuffledCopy(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function startGame() {
    const cat = els.category.value;
    let count = parseInt(els.count.value, 10);
    if (isNaN(count)) count = 5;
    count = Math.max(3, Math.min(10, count));
    els.count.value = count;

    const pool = cat === 'mix'
      ? Object.values(emojiCategories).flat()
      : [...emojiCategories[cat]];

    originalOrder = shuffledCopy(pool).slice(0, count);
    currentEmojis = [...originalOrder];
    removedEmoji = null;
    roundNumber++;
    phase = 'playing';

    els.startBtn.textContent = '🔄 Neue Runde';
    els.roundBadge.textContent = `Runde ${roundNumber}`;

    render(currentEmojis);
    setStatus('Merkt euch gut die Reihenfolge! 👀');
    updateButtons();
  }

  function render(emojis, highlightEmoji = null) {
    els.container.innerHTML = '';
    els.container.classList.toggle('empty', emojis.length === 0);

    // Fehlt eins, verteilen wir die übrigen großzügiger, damit die Lücke
    // nicht durch engere Abstände / kleinere Symbole zu erraten ist.
    const baseCount = originalOrder.length || emojis.length || 1;
    const shownCount = emojis.length || 1;
    let scale = Math.sqrt(baseCount / shownCount);
    scale = Math.min(1.35, Math.max(1, scale));
    els.container.style.setProperty('--scale', scale.toFixed(3));

    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.classList.add('emoji-slot');
      span.textContent = emoji;
      if (highlightEmoji !== null && emoji === highlightEmoji) {
        span.classList.add('highlighted');
      }
      els.container.appendChild(span);
    });
  }

  function removeEmoji() {
    if (phase !== 'playing' || removedEmoji || currentEmojis.length <= 1) return;
    const index = Math.floor(Math.random() * currentEmojis.length);
    removedEmoji = currentEmojis.splice(index, 1)[0];
    render(currentEmojis);
    setStatus('Was fehlt? 🤔');
    updateButtons();
  }

  function shuffleEmojis() {
    if (phase !== 'playing' || currentEmojis.length < 2) return;
    const i = Math.floor(Math.random() * currentEmojis.length);
    let j = Math.floor(Math.random() * currentEmojis.length);
    while (j === i) j = Math.floor(Math.random() * currentEmojis.length);
    [currentEmojis[i], currentEmojis[j]] = [currentEmojis[j], currentEmojis[i]];
    render(currentEmojis);
    setStatus(removedEmoji ? 'Zwei wurden vertauscht 🤔' : 'Zwei wurden vertauscht – schaut genau hin! 🔀');
    updateButtons();
  }

  function removeAndShuffle() {
    if (phase !== 'playing' || removedEmoji || currentEmojis.length <= 1) return;
    const index = Math.floor(Math.random() * currentEmojis.length);
    removedEmoji = currentEmojis.splice(index, 1)[0];
    currentEmojis = shuffledCopy(currentEmojis);
    render(currentEmojis);
    setStatus('Was fehlt? 🤔🔀');
    updateButtons();
  }

  function reveal() {
    if (phase !== 'playing') return;
    phase = 'revealed';
    render(originalOrder, removedEmoji);
    setStatus(removedEmoji ? 'Aufgelöst! Das hier hat gefehlt ✅' : 'Aufgelöst! Es fehlte nichts – nur gemischt 🔀');
    updateButtons();
  }

  function setStatus(text) {
    els.status.textContent = text;
  }

  function updateButtons() {
    els.removeBtn.disabled = !(phase === 'playing' && !removedEmoji);
    els.shuffleBtn.disabled = !(phase === 'playing' && currentEmojis.length >= 2);
    els.comboBtn.disabled = !(phase === 'playing' && !removedEmoji);
    els.revealBtn.disabled = !(phase === 'playing');
  }

  function resetRounds() {
    phase = 'idle';
    originalOrder = [];
    currentEmojis = [];
    removedEmoji = null;
    roundNumber = 0;

    els.roundBadge.textContent = 'Noch keine Runde gespielt';
    els.startBtn.textContent = 'Start';
    render([]);
    setStatus('Wähle Kategorie & Anzahl, dann Start drücken');
    updateButtons();
  }
</script>
</body>
</html>
